name: sync-matches (every 5m)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the feed without database writes
        type: boolean
        default: true
      standings_only:
        description: Refresh source standings without changing match results
        type: boolean
        default: false
      flash_urls:
        description: Optional competition URLs; leave empty for the configured feeds
        type: string
        required: false
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 5 * * *"
    - cron: "43 */3 * * *"

permissions:
  contents: read

concurrency:
  group: rugby-now-sync-full
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || vars.DATA_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Plan bounded feed groups
        id: plan
        env:
          FLASH_URLS: ${{ inputs.flash_urls || vars.FLASH_URLS }}
          STANDINGS_ONLY: ${{ (inputs.standings_only || github.event.schedule == '43 */3 * * *') && '1' || '0' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let feeds = [...new Set((process.env.FLASH_URLS || '').split(/\r?\n|,/).map(s => s.trim()).filter(Boolean))];
          if (process.env.STANDINGS_ONLY === '1') {
            const supported = new Set(['ar-urba-top14','fr-top14','fr-pro-d2','en-premiership-rugby','it-serie-a-elite','int-united-rugby-championship','sra','us-mlr']);
            feeds = feeds.filter(feed => supported.has(feed.split('=')[0]));
          }
          if (!feeds.length) throw new Error('No supported competition feeds configured.');
          const groups = Array.from({length: Math.min(4, feeds.length)}, (_, index) => ({group: index + 1, urls: []}));
          feeds.forEach((feed, index) => groups[index % groups.length].urls.push(feed));
          const matrix = {include: groups.map(group => ({group: group.group, urls: group.urls.join('\n')}))};
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          console.log(`Planned ${feeds.length} feeds in ${groups.length} groups.`);
          NODE
      - name: Install dependencies for competition setup
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Ensure configured competitions once
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          FLASH_URLS: ${{ inputs.flash_urls || vars.FLASH_URLS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ensure:flashscore-competitions

  sync_scores:
    needs: prepare
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Feed group ${{ matrix.group }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node20-sync-full-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Run matches sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLASH_URLS: ${{ matrix.urls }}
          STANDINGS_ONLY: ${{ (inputs.standings_only || github.event.schedule == '43 */3 * * *') && '1' || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          DRY_RUN_REPORT_DIR: logs/import-validation
        run: npm run sync:matches
      - name: Save per-source health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ matrix.group }}
          path: logs/import-health/*.json
          retention-days: 14
      - name: Save current import validation reports
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: import-validation-${{ matrix.group }}
          path: logs/import-validation/*.json
          retention-days: 7

  snapshot:
    needs: [prepare, sync_scores]
    # A failed feed retains its previous data. Export still validates a complete
    # DB read; independent official updates must not be skipped with that feed.
    # The failed matrix job keeps the overall workflow red.
    if: always() && ((github.event_name == 'workflow_dispatch' && !inputs.dry_run) || github.event.schedule == '17 5 * * *' || github.event.schedule == '43 */3 * * *') && github.ref == 'refs/heads/main' && needs.prepare.result == 'success' && contains(fromJSON('["success","failure"]'), needs.sync_scores.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Collect source health including partial failures
        uses: actions/download-artifact@v4
        with:
          pattern: source-health-*
          path: logs/import-health
          merge-multiple: true
      - name: Summarize source validation
        env:
          IMPORT_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: npx tsx scripts/report-import-health.ts
      - name: Refresh official URBA LNR and EPCR standings
        continue-on-error: true
        run: npm run sync:official-standings
      - name: Refresh official Pro D2 calendar
        continue-on-error: true
        run: npm run sync:pro-d2-calendar
      - name: Refresh official URBA regular calendar
        continue-on-error: true
        run: npm run sync:urba-calendar
      - name: Refresh official Top 14 calendar
        continue-on-error: true
        run: npm run sync:top14-calendar
      - name: Refresh official club player directories
        continue-on-error: true
        run: npm run sync:squads
      - name: Refresh official club institutions
        continue-on-error: true
        run: npm run sync:club-information
      - name: Refresh independent news feeds
        continue-on-error: true
        run: npm run sync:news
      - name: Refresh confirmed match broadcasts
        continue-on-error: true
        run: |
          npm run sync:broadcasts
          npm run sync:broadcasts -- --source=https://top14.lnr.fr/calendrier-et-resultats
      - name: Export complete Supabase snapshot
        id: export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run export:supabase-snapshot
      - name: Commit snapshot if changed
        id: publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/supabase-snapshot.json /tmp/supabase-snapshot.json
          cp data/news-snapshot.json /tmp/news-snapshot.json
          cp data/official-standings.json /tmp/official-standings.json
          cp data/match-broadcasts.json /tmp/match-broadcasts.json
          cp data/team-squads.json /tmp/team-squads.json
          cp data/urba-calendar.json /tmp/urba-calendar.json
          cp data/club-information.json /tmp/club-information.json
          cp data/top14-calendar.json /tmp/top14-calendar.json
          cp data/pro-d2-calendar.json /tmp/pro-d2-calendar.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/supabase-snapshot.json data/supabase-snapshot.json
            cp /tmp/news-snapshot.json data/news-snapshot.json
            cp /tmp/official-standings.json data/official-standings.json
            cp /tmp/match-broadcasts.json data/match-broadcasts.json
            cp /tmp/team-squads.json data/team-squads.json
            cp /tmp/urba-calendar.json data/urba-calendar.json
            cp /tmp/club-information.json data/club-information.json
            cp /tmp/top14-calendar.json data/top14-calendar.json
            cp /tmp/pro-d2-calendar.json data/pro-d2-calendar.json
            git add data/supabase-snapshot.json data/news-snapshot.json data/official-standings.json data/match-broadcasts.json data/team-squads.json data/pro-d2-calendar.json data/top14-calendar.json data/club-information.json data/urba-calendar.json
            git diff --cached --quiet && echo "No snapshot changes to commit." && exit 0
            git commit -m "Update complete score and news snapshots"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Failed to push snapshot after 3 attempts."
          exit 1
      - name: Record export and snapshot publication outcomes
        if: always()
        env:
          EXPORT_STATUS: ${{ steps.export.outcome }}
          PUBLICATION_STATUS: ${{ steps.publication.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'logs/import-summary/sources.json';
          fs.mkdirSync('logs/import-summary', {recursive:true});
          const report = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file,'utf8')) : {status:'unverified'};
          report.exportStatus = process.env.EXPORT_STATUS || 'not_started';
          report.publicationStatus = process.env.PUBLICATION_STATUS || 'not_started';
          report.finishedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(report,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nComplete export: ${report.exportStatus}. Snapshot commit/push step: ${report.publicationStatus}. This does not verify a deployment.\n`);
          NODE
      - name: Save source validation and export report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-import-summary
          path: logs/import-summary/*.json
          retention-days: 14
