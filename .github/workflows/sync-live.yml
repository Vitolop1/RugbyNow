name: sync-live (every 5m)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Read source data without writing results
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: rugby-now-live
  cancel-in-progress: false

jobs:
  sync_live:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node20-live-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Refresh active fixtures and verify source health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLASH_URLS: ${{ vars.FLASH_URLS }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          echo "UTC now: $(date -u +'%Y-%m-%d %H:%M:%S')"
          npm run sync:live
      - name: Save live run and per-source health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-health
          path: logs/live-health/**/*.json
          retention-days: 14
